<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 📱 홈 화면 설치(PWA) — 학생 폰에서 앱처럼 열린다. 검색 노출과는 무관(아래 robots 차단 유지). 2026-09-08 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1f6feb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Summit On" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 🔒 앱 비노출 — 지정하지 않은 사람은 존재 자체를 모르게. 검색엔진·AI 크롤러 색인 전면 차단.
         (실제 접근 차단은 로그인/RLS 가 담당. 이건 "검색으로 발견되지 않게" 하는 층이다.) -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!-- Pretendard — 매쓰플랫과 동일한 본문 글꼴 (오픈소스 OFL). 변수 폰트 1개로 전 굵기 커버. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <title>Summit On</title>
  </head>
  <body>
    <!-- 🟢 올리오 셸(관리형학습관 학생 태블릿) 안 iframe 으로 열릴 때 — 주소 플래그 theme=ollio&embed=1 (식별용, 인증 아님).
         React 가 뜨기 전에 html 에 data-theme/data-embed 를 걸어 첫 렌더부터 올리오 색(초록·종이)과 글꼴(Noto Sans KR)이 나오게 한다.
         글꼴은 올리오 셸 안에서 열릴 때만 불러온다(단독 화면은 받지 않음). 2026-10-25 Gowun Dodum·Cafe24 Ssurround → Noto Sans KR(올리오 앱과 같게).
         치환표 원본: 올리오 저장소 ollio-theme.json · 받는 코드: src/lib/ollioTheme.ts · CSS: src/index.css 맨 아래. (2026-10-24) -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          if (q.get('theme') === 'ollio') {
            document.documentElement.setAttribute('data-theme', 'ollio');
            var f = document.createElement('link'); f.rel = 'stylesheet';
            f.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap';
            document.head.appendChild(f);
          }
          if (q.get('embed') === '1') document.documentElement.setAttribute('data-embed', '');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
